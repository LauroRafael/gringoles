# Gringolês — Netlify (https://gringoles.lartecnologia.com.br)
[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback (rotas inexistentes voltam ao app)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Service worker e manifest: nunca em cache (atualização imediata do PWA)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Assets com hash: cache agressivo
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
