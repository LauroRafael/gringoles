# Gringolês — Netlify (https://gringoles.com.br)
[build]
  command = "npm run build"
  publish = "dist"

# Domínio antigo -> domínio novo (evita conteúdo duplicado e PWA preso no host velho)
[[redirects]]
  from = "https://gringoles.lartecnologia.com.br/*"
  to = "https://gringoles.com.br/:splat"
  status = 301
  force = true

# www -> apex (canônico sem www)
[[redirects]]
  from = "https://www.gringoles.com.br/*"
  to = "https://gringoles.com.br/:splat"
  status = 301
  force = true

# SPA fallback (rotas inexistentes voltam ao app)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Segurança + HTTPS (mata "conteúdo misto": converte http:// residual em https://)
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "upgrade-insecure-requests"

# Service worker e manifest: nunca em cache (atualização imediata do PWA)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Assets com hash: cache agressivo
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
